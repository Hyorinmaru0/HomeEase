name: homeease
description: "HomeEase — an ESP32 smart home and energy companion."
publish_to: 'none'

version: 1.0.2+3

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.6.0
  shared_preferences: ^2.5.5
  speech_to_text: ^7.5.0
  audioplayers: ^6.8.1
  crypto: ^3.0.7
  flutter_secure_storage: ^11.2.0
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  shared_preferences_platform_interface: ^2.4.2

flutter:

  uses-material-design: true
  assets:
    - assets/audio/safety_alarm.wav
